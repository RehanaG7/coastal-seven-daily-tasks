version: "3.8"

services:
  # 1. Redis Cache & Celery Message Broker
  redis:
    image: redis:7-alpine
    container_name: rmart-day22-redis
    ports:
      - "6379:6379"
    restart: always

  # 2. FastAPI Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmart-day22-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./backend/ecommerce.db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - redis
    restart: always

  # 3. Celery Background Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmart-day22-celery
    command: celery -A backend.tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./backend/ecommerce.db
    depends_on:
      - redis
      - backend
    restart: always

  # 4. React Vite Frontend
  frontend:
    image: node:20-alpine
    container_name: rmart-day22-frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: always
