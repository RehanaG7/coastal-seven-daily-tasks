name: E-Commerce CI Automated Test Matrix (Days 10-19)

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: FastAPI Backend Pytest Suite (Day-10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: ./Day-10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "bcrypt==4.0.1" pytest httpx

      - name: Run Backend Pytest Suite (21 Tests)
        working-directory: ./Day-10
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests

  day15-frontend-test:
    name: Day-15 TypeScript & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Day-15/package.json

      - name: Install Dependencies
        working-directory: ./Day-15
        run: npm ci || npm install

      - name: Run TypeScript Type Check
        working-directory: ./Day-15
        run: npx tsc --noEmit

      - name: Run Vitest Component & MSW Tests
        working-directory: ./Day-15
        run: npx vitest run

      - name: Build Production Frontend
        working-directory: ./Day-15
        run: npm run build

  day16-frontend-test:
    name: Day-16 Zustand, React Query & Component Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Day-16/package.json

      - name: Install Dependencies
        working-directory: ./Day-16
        run: npm ci || npm install

      - name: Run TypeScript Type Check
        working-directory: ./Day-16
        run: npx tsc --noEmit

      - name: Run 25 Vitest Tests
        working-directory: ./Day-16
        run: npx vitest run

      - name: Build Production Frontend
        working-directory: ./Day-16
        run: npm run build

  day19-backend-test:
    name: Day-19 FastAPI Backend & Security Suite (38 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: ./Day-19/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "bcrypt==4.0.1" pytest httpx

      - name: Run Day-19 Pytest Suite
        working-directory: ./Day-19/backend
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests

  day19-frontend-test:
    name: Day-19 Frontend Vitest & Build Suite (50 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: Day-19/package-lock.json

      - name: Install Dependencies
        working-directory: ./Day-19
        run: npm ci

      - name: Run Vitest Suite (50 Tests)
        working-directory: ./Day-19
        run: npm test

      - name: Build Production Frontend
        working-directory: ./Day-19
        run: npm run build
