# ==============================================================================
# Day 24 DevOps / AWS Focus: Production Nginx Reverse Proxy with HTTPS & WebSockets
# ==============================================================================

# Rate limiting zone: max 30 requests/second per IP address
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server Block: Enforces Strict HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.rmart.store localhost _;

    # Allow Let's Encrypt Certbot ACME HTTP-01 challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block: TLSv1.2 / TLSv1.3 & Reverse Proxy to FastAPI
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rmart.store localhost;

    # SSL Certificate Paths (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.rmart.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rmart.store/privkey.pem;

    # Modern TLS Security Ciphers & Protocol Standards
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enterprise HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging Destinations for CloudWatch Agent
    access_log /var/log/nginx/rmart_access.log;
    error_log /var/log/nginx/rmart_error.log warn;

    # Static Assets Fast Delivery & Browser Caching
    location /static/ {
        alias /opt/rmart/Day-24/backend/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse Proxy to Internal FastAPI ASGI Server (Port 8000)
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket Bidirectional Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client Connection Metadata Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long-Running Tasks & Streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
