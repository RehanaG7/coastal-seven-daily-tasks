name: Day 15 CI Automated Test Suite

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Day-15/package.json

      - name: Install Dependencies
        working-directory: ./Day-15
        run: npm ci || npm install

      - name: Run TypeScript Type Check
        working-directory: ./Day-15
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Tests (with MSW)
        working-directory: ./Day-15
        run: npx vitest run
